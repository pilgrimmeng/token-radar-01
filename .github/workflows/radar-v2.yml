name: Radar v2 smoke checks
on:
  push:
    branches:
      - work/calibrated-radar-v2-20261118
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: TypeScript model smoke tests
        run: node --test tests/smoke.test.ts
      - name: Check no private snapshot or credentials were committed
        shell: bash
        run: |
          test ! -e snapshot.json
          test ! -e .env
          test ! -e makefun-keypair.json
